<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUNDIT</title>
  <meta name="description" content="Evidence-based mutual fund decision support." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens ─────────────────────────────────────────────── */
    :root {
      --bg:          #0B0B0B;
      --surface:     #121212;
      --surface2:    #181818;
      --border:      #2A2A2A;
      --border-hi:   #404040;
      
      /* Restrained neutral/off-white accent */
      --accent:      #EDEDED;
      --accent-dim:  #666666;
      
      --text:        #E0E0E0;
      --text-dim:    #999999;
      --text-faint:  #666666;
      
      --radius:      4px;
      --radius-sm:   2px;
      
      --font:        'Inter', system-ui, sans-serif;
      --mono:        'JetBrains Mono', monospace;
    }

    /* ── Reset ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ───────────────────────────────────────────────────── */
    .page { max-width: 680px; margin: 0 auto; padding: 60px 20px 100px; }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      margin-bottom: 60px;
    }
    .logo-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 14px;
      color: var(--text-dim);
    }

    /* ── Query ────────────────────────────────────────────────────── */
    .query-section {
      margin-bottom: 40px;
    }
    .query-label {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .query-input-wrap {
      position: relative;
    }
    textarea#query-input {
      width: 100%;
      min-height: 120px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      padding: 16px;
      resize: vertical;
      outline: none;
      transition: border-color .2s;
      line-height: 1.6;
    }
    textarea#query-input::placeholder { color: var(--text-faint); }
    textarea#query-input:focus { border-color: var(--accent-dim); }

    .query-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }
    .char-count {
      font-size: 12px;
      color: var(--text-faint);
    }
    
    #submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #000;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--accent);
      padding: 8px 24px;
      cursor: pointer;
      transition: opacity .15s;
    }
    #submit-btn:hover:not(:disabled) {
      opacity: 0.9;
    }
    #submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-spinner {
      width: 14px; height: 14px;
      border: 1.5px solid rgba(0,0,0,.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    #submit-btn.loading .btn-spinner { display: block; }
    #submit-btn.loading .btn-text { display: none; }

    /* ── Examples ─────────────────────────────────────────────────── */
    .examples-label {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 32px;
      margin-bottom: 8px;
    }
    .examples {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .example-link {
      font-size: 13px;
      color: var(--text-dim);
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      transition: color .2s;
    }
    .example-link:hover {
      color: var(--text);
      text-decoration: underline;
    }

    /* ── Progress ─────────────────────────────────────────────────── */
    #progress-panel {
      display: none;
      padding: 32px 0;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    .stages {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stage {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-faint);
    }
    .stage.active { color: var(--text); }
    .stage.done { color: var(--text-dim); }
    .stage-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border-hi);
    }
    .stage.active .stage-indicator {
      background: var(--text);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .stage.done .stage-indicator {
      background: var(--text-dim);
    }

    /* ── Error & Abstention ───────────────────────────────────────── */
    #error-panel, #abstention-panel {
      display: none;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-top: 40px;
    }
    .err-title, .abstention-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }
    .err-body, .abstention-reason { 
      font-size: 14px; 
      color: var(--text-dim); 
    }

    /* ── Result ───────────────────────────────────────────────────── */
    #result-panel {
      display: none;
      margin-top: 40px;
      border-top: 1px solid var(--border);
      padding-top: 40px;
    }
    
    .section-divider {
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }

    .rec-label {
      font-size: 12px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .rec-fund-name {
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .rec-confidence {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 12px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .prose {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Key metrics grid (text based) */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .metric-label { font-size: 12px; color: var(--text-faint); }
    .metric-value { font-size: 14px; color: var(--text-dim); font-family: var(--mono); }

    /* Lists */
    .text-list { 
      list-style: none; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      margin-bottom: 32px;
    }
    .text-list li {
      font-size: 14px;
      color: var(--text-dim);
      padding-left: 16px;
      position: relative;
    }
    .text-list li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--text-faint);
    }

    /* Citations */
    .citations-list { 
      display: flex; 
      flex-direction: column; 
      gap: 24px; 
      margin-bottom: 32px;
    }
    .citation-item {
      font-size: 13px;
    }
    .citation-meta {
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .citation-id {
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      margin-right: 4px;
    }
    .citation-snippet {
      color: var(--text-faint);
      line-height: 1.5;
    }
    .citation-snippet a {
      color: var(--text-dim);
      text-decoration: underline;
    }

    /* Candidates (Optional collapsed section) */
    .candidates-list { 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    .candidate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-dim);
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .candidate-row:last-child {
      border-bottom: none;
    }
    .cand-name { flex: 1; }
    .cand-score { font-family: var(--mono); }

    /* Disclaimer */
    .disclaimer {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 40px;
    }

    /* ── Animations ─────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Mobile ─────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .page { padding: 40px 20px 60px; }
      .metrics-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header>
    <div class="logo-name">FUNDIT</div>
    <div class="tagline">Evidence-based mutual fund decision support.</div>
  </header>

  <!-- ── Query Section ──────────────────────────────────────────── -->
  <div class="query-section">
    <div class="query-label">What are you looking for?</div>
    <div class="query-input-wrap">
      <textarea
        id="query-input"
        placeholder="Tell us what you want to invest in..."
        maxlength="600"
      ></textarea>
    </div>
    <div class="query-footer">
      <span class="char-count" id="char-count">0 / 600</span>
      <button id="submit-btn" type="button" onclick="submitQuery()">
        <div class="btn-spinner"></div>
        <span class="btn-text">Analyse</span>
      </button>
    </div>

    <div class="examples-label">Examples</div>
    <div class="examples" id="examples-row"></div>
  </div>

  <!-- ── Progress ───────────────────────────────────────────────── -->
  <div id="progress-panel">
    <div class="stages" id="stages-container"></div>
  </div>

  <!-- ── Error ──────────────────────────────────────────────────── -->
  <div id="error-panel">
    <div class="err-title">Unable to process request</div>
    <div class="err-body" id="error-body"></div>
  </div>

  <!-- ── Abstention ─────────────────────────────────────────────── -->
  <div id="abstention-panel">
    <div class="abstention-title">Unable to make a reliable recommendation.</div>
    <div class="abstention-reason">
      Reason:<br/>
      <span id="abstention-reason-text"></span>
    </div>
  </div>

  <!-- ── Result ─────────────────────────────────────────────────── -->
  <div id="result-panel"></div>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <div class="disclaimer" style="text-align: center;">
    <a href="/docs" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">API Docs</a>
  </div>

</div>

<script>
/* ── Config ─────────────────────────────────────────────────────── */
const API_BASE = ''; 
const MAX_QUERY = 600;

// Show at most TWO examples
const EXAMPLES = [
  'Best large cap fund for a 5-year horizon',
  'Low-risk fund for emergency savings'
];

const STAGES = [
  { id: 'parse',     label: 'Understanding requirements' },
  { id: 'filter',    label: 'Filtering candidates' },
  { id: 'retrieve',  label: 'Retrieving evidence' },
  { id: 'rerank',    label: 'Reranking evidence' },
  { id: 'decide',    label: 'Computing decision' },
  { id: 'explain',   label: 'Generating analysis' },
];

/* ── State ───────────────────────────────────────────────────────── */
let stageTimer = null;

/* ── Init ────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  buildExamples();
  buildStages();
  const ta = document.getElementById('query-input');
  ta.addEventListener('input', updateCharCount);
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submitQuery();
  });
});

function buildExamples() {
  const row = document.getElementById('examples-row');
  EXAMPLES.forEach(ex => {
    const btn = document.createElement('button');
    btn.className = 'example-link';
    btn.textContent = ex;
    btn.onclick = () => {
      document.getElementById('query-input').value = ex;
      updateCharCount();
      document.getElementById('query-input').focus();
    };
    row.appendChild(btn);
  });
}

function buildStages() {
  const container = document.getElementById('stages-container');
  STAGES.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stage';
    div.id = `stage-${s.id}`;
    div.innerHTML = `
      <div class="stage-indicator"></div>
      <div>${s.label}</div>
    `;
    container.appendChild(div);
  });
}

function updateCharCount() {
  const ta = document.getElementById('query-input');
  const cc = document.getElementById('char-count');
  const len = ta.value.length;
  cc.textContent = `${len} / ${MAX_QUERY}`;
}

/* ── Query submission ────────────────────────────────────────────── */
async function submitQuery() {
  const query = document.getElementById('query-input').value.trim();
  if (!query) return;

  setLoading(true);
  hideAll();
  showProgress();
  animateStages();

  try {
    const resp = await fetch(`${API_BASE}/api/v1/decisions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, debug: false }),
      signal: AbortSignal.timeout(90000),
    });

    stopStageAnimation();

    if (!resp.ok) {
      let errMsg = `HTTP ${resp.status}`;
      try {
        const errData = await resp.json();
        errMsg = errData?.detail?.message || errData?.detail || errData?.error?.message || errMsg;
      } catch {}
      showError(errMsg, resp.status);
      return;
    }

    const data = await resp.json();
    hideAll();

    if (data.abstained) {
      showAbstention(data);
    } else {
      showResult(data);
    }

  } catch (err) {
    stopStageAnimation();
    if (err.name === 'TimeoutError' || err.name === 'AbortError') {
      showError('Request timed out. Please try again in a moment.', 408);
    } else if (err.message.includes('fetch') || err.message.includes('network') || err.message.toLowerCase().includes('failed')) {
      showError('Cannot reach the backend server.', 503);
    } else {
      showError(err.message || 'An unexpected error occurred.', 500);
    }
  } finally {
    setLoading(false);
  }
}

/* ── UI state helpers ────────────────────────────────────────────── */
function setLoading(on) {
  const btn = document.getElementById('submit-btn');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

function hideAll() {
  ['progress-panel','error-panel','abstention-panel','result-panel'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  clearInterval(stageTimer);
  document.querySelectorAll('.stage').forEach(s => {
    s.classList.remove('active','done');
  });
}

function showProgress() {
  document.getElementById('progress-panel').style.display = 'block';
}

function animateStages() {
  let i = 0;
  const stages = document.querySelectorAll('.stage');
  const timings = [800, 1200, 2000, 1500, 1200, 0];

  function activate(idx) {
    stages.forEach((s, j) => {
      if (j < idx) { s.classList.remove('active'); s.classList.add('done'); }
      else if (j === idx) { s.classList.add('active'); s.classList.remove('done'); }
      else { s.classList.remove('active','done'); }
    });
  }

  activate(0);
  let cum = 0;
  STAGES.forEach((s, idx) => {
    if (idx === STAGES.length - 1) {
      setTimeout(() => activate(idx), cum);
    } else {
      setTimeout(() => activate(idx), cum);
      cum += timings[idx] || 800;
    }
  });
}

function stopStageAnimation() {
  clearInterval(stageTimer);
  document.querySelectorAll('.stage').forEach(s => {
    s.classList.remove('active');
    s.classList.add('done');
  });
}

function showError(message, status) {
  const panel = document.getElementById('error-panel');
  panel.style.display = 'block';
  document.getElementById('error-body').textContent = message;
}

function showAbstention(data) {
  const panel = document.getElementById('abstention-panel');
  panel.style.display = 'block';
  document.getElementById('abstention-reason-text').textContent =
    data.abstention_reason || 'The available evidence does not satisfy the requested constraints.';
}

/* ── Result rendering ────────────────────────────────────────────── */
function showResult(data) {
  const panel = document.getElementById('result-panel');
  panel.style.display = 'block';
  panel.innerHTML = buildResultHTML(data);
}

function buildResultHTML(data) {
  const w = data.winner;
  const conf = data.confidence || {};
  const confLevel = conf.level || 'MEDIUM';
  const score = w ? (w.composite_score || 0) : 0;
  
  let html = '';

  // ── Header ──
  html += `<div class="rec-label">Recommendation</div>`;
  html += `<div class="rec-fund-name">${esc(w?.fund_name || '—')}</div>`;
  
  // Minimal confidence display
  let marginText = '';
  if (conf.score_margin !== undefined) {
    marginText = ` · ${(conf.score_margin * 100).toFixed(1)} pt margin`;
  }
  html += `<div class="rec-confidence">${confLevel} confidence${marginText}</div>`;
  html += `<div class="section-divider"></div>`;

  // ── Explanation ──
  if (data.recommendation_text) {
    html += `<div class="section-title">Why this was selected</div>`;
    html += `<div class="prose">${esc(data.recommendation_text)}</div>`;
  }

  // ── Key Factors (Metrics + Reasons) ──
  const sf = w?.structured_facts || {};
  const metrics = buildMetrics(sf);
  
  if (metrics.length > 0 || (data.reasons && data.reasons.length)) {
    html += `<div class="section-title">Key factors</div>`;
    
    if (metrics.length > 0) {
      html += `<div class="metrics-grid">`;
      metrics.forEach(m => {
        html += `<div class="metric-item">
          <span class="metric-label">${esc(m.label)}</span>
          <span class="metric-value">${esc(m.value)}</span>
        </div>`;
      });
      html += `</div>`;
    }
    
    if (data.reasons && data.reasons.length) {
      html += `<ul class="text-list">`;
      data.reasons.forEach(r => {
        html += `<li>${esc(r)}</li>`;
      });
      html += `</ul>`;
    }
    
    html += `<div class="section-divider"></div>`;
  }

  // ── Tradeoffs ──
  const tradeoffs = gatherTradeoffs(data);
  if (tradeoffs.length) {
    html += `<div class="section-title">Trade-offs</div>`;
    html += `<ul class="text-list">`;
    tradeoffs.forEach(t => {
      html += `<li>${esc(t)}</li>`;
    });
    html += `</ul>`;
    html += `<div class="section-divider"></div>`;
  }

  // ── Citations ──
  if (data.citations && data.citations.length) {
    html += `<div class="section-title">Evidence</div>`;
    html += `<div class="citations-list">`;
    data.citations.forEach(c => {
      const url = c.source_url;
      html += `<div class="citation-item">
        <div class="citation-meta">
          <span class="citation-id">${esc(c.citation_id)}</span> 
          ${esc(c.title)}
        </div>
        <div class="citation-snippet">
          "${esc(c.snippet)}" 
          ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">source</a>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
    html += `<div class="section-divider"></div>`;
  }
  
  // ── Decision Trace (Candidates) ──
  if (data.top_candidates && data.top_candidates.length > 1) {
    html += `<div class="section-title">Decision trace</div>`;
    html += `<div class="candidates-list">`;
    data.top_candidates.slice(0, 5).forEach((c, i) => {
      html += `<div class="candidate-row">
        <div class="cand-name">${esc(c.fund_name)}</div>
        <div class="cand-score">${((c.composite_score||0)*100).toFixed(0)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // ── Disclaimer ──
  html += `<div class="disclaimer">
    Disclaimer: ${esc(data.disclaimer || 'Not financial advice. Mutual fund investments are subject to market risks.')}
  </div>`;

  return html;
}

function buildMetrics(sf) {
  const metrics = [];
  const fmt = (v, d=1) => v !== null && v !== undefined ? Number(v).toFixed(d) : null;

  if (sf.risk_level) metrics.push({ label: 'Risk', value: sf.risk_level });
  if (sf.expense_ratio !== null && sf.expense_ratio !== undefined)
    metrics.push({ label: 'Expense', value: fmt(sf.expense_ratio, 2) + '%' });
  if (sf.cagr_3y !== null && sf.cagr_3y !== undefined)
    metrics.push({ label: '3Y CAGR', value: fmt(sf.cagr_3y) + '%' });
  if (sf.sharpe_ratio_3y !== null && sf.sharpe_ratio_3y !== undefined)
    metrics.push({ label: 'Sharpe (3Y)', value: fmt(sf.sharpe_ratio_3y, 2) });

  return metrics;
}

function gatherTradeoffs(data) {
  const notes = [];
  if (data.tradeoffs && Array.isArray(data.tradeoffs)) {
    data.tradeoffs.forEach(t => {
      if (typeof t === 'string') notes.push(t);
      else if (t.note) notes.push(t.note);
      else if (t.description) notes.push(t.description);
    });
  }
  return notes;
}

/* ── Utility ─────────────────────────────────────────────────────── */
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
</script>
